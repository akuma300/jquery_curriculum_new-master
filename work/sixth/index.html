<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../common/css/reset.css">
  <link rel="stylesheet" href="../../common/css/base.css">
  <link rel="stylesheet" href="./css/style.css">
  <title>Document</title>
</head>
<body>
  <div class="wrapper" id="wrapper">
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  </div>
  <script src="../../common/js/jquery.js"></script>
  <script>
  $(function () {
  // 「ポケモンを探す」ボタンの画面表示
  let searchHtml =
  `
    <button type="button" class="btn search-btn" id="pokemon_search">ポケモンを探す</button>
  `
  // 「捕まえる」失敗時の画面表示
  let failHtml =
  `
    <p class="text">逃げられてしまった...</p>
    <button class="btn mt" data-js="reset">戻る</button>
  `

  // 「ポケモンを探す」後の画面表示
  let encountHtml =
  `
    <p class="name"></p>
    <div>
      <img class="img" src="" alt="">
    </div>
    <div>
      <button class="btn" id="catch">捕まえる</button>
      <button class="btn" data-js="reset">逃げる</button>
    </div>
  `

  // 「捕まえる」成功時の画面表示
  let doneHtml =
  `
    <p class="name">ゲットしました</p>
    <div>
      <img class="img" src="" alt="">
    </div>
    <button class="btn" data-js="reset">戻る</button>
  `
  $('.wrapper').html(searchHtml);

  $(document).on('click', '#pokemon_search', function () {
  let randomId = Math.floor(Math.random() * 151) + 1;

    $.ajax({
      url: `https://pokeapi.co/api/v2/pokemon/${randomId}`,
      type: 'GET',

      success: function (pokemonData){

        $.ajax({
          url: `https://pokeapi.co/api/v2/pokemon-species/${randomId}`,
          type: 'GET',

          success: function (speciesData) {
          const japaneseName = speciesData.names.find(function(name) {
            return name.language.name === 'ja';
          });

          $('#wrapper').html(encountHtml);
          $('.name').text(japaneseName.name);
          $('.img').attr('src', pokemonData.sprites.front_default);
          },
        });
      }
    });
  });

  $(document).on('click', '#catch', function () {

    let randomCatch = Math.floor(Math.random() * 2);

    if (randomCatch === 0) {

      $('#wrapper').html(doneHtml);

      $.ajax({
        url: 'https://pokeapi.co/api/v2/item/4',
        type: 'GET',

        success: function(data) {
          $('.img').attr('src', data.sprites.default);
        }
      });

    } else {
      $('#wrapper').html(failHtml);
    }
  });

    $(document).on('click', '[data-js="reset"]', function () {
      $('#wrapper').html(searchHtml);
    });
  });
      // 今回やるのはAjax通信です。
      // ボタンをクリックすると、Ajax通信でポケモンのデータを取得し、画面に表示するプログラムです。
      // [使用するメソッド]
      // .on() イベントを設定します。
      // .ajax() Ajax通信を行います。
      // .append() 要素の最後に追加します。
      // [確認してほしい挙動]
      // ・ボタンをクリックすると、ポケモンの名前が画面に表示されること
      // ・ボタンを連続でクリックしても、同じポケモンの名前が重複して表示されないこと
    // 回答はここに書いてね
  </script>
</body>
</html>
